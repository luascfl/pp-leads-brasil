version: 2
project_name: leads-brasil-pp-cli
changelog:
  disable: true
builds:
  - id: leads-brasil-pp-cli
    main: ./cmd/leads-brasil-pp-cli
    binary: leads-brasil-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X leads-brasil-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: leads-brasil-pp-mcp
    main: ./cmd/leads-brasil-pp-mcp
    binary: leads-brasil-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: leads-brasil-pp-cli
    repository:
      owner: luascfl
      name: homebrew-tap
    homepage: "https://github.com/luascfl/leads-brasil-pp-cli"
    description: "Platform for Brazilian Lead Intelligence (CNPJs, Companies, People)"
    install: |
      bin.install "leads-brasil-pp-cli"
      bin.install "leads-brasil-pp-mcp"
