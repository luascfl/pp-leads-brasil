openapi: 3.0.0
info:
  title: Leads Brasil Platform API
  version: 0.1.0
  description: Platform for Brazilian Lead Intelligence (CNPJs, Companies, People)
servers:
  - url: http://localhost:8080/v1
paths:
  /company/{cnpj}:
    get:
      summary: Get company data by CNPJ
      parameters:
        - name: cnpj
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Company details
  /search:
    post:
      summary: Search for companies by name or filter
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                cnae:
                  type: string
      responses:
        '200':
          description: List of companies
  /enrich/{cnpj}:
    post:
      summary: Trigger enrichment for a company via PP Suite
      parameters:
        - name: cnpj
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Enrichment job started
  /operations/plan:
    post:
      summary: Create a side-effect-free external operation plan for the configured private profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile, kind, operator, targets]
      responses:
        '201':
          description: Immutable, expiring operation plan
        '400':
          description: Invalid plan or no explicit profile
  /operations/{plan_id}/apply:
    post:
      summary: Apply a stored external operation plan with explicit approval
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved:
                  type: boolean
      responses:
        '200':
          description: Per-target operation receipts
        '409':
          description: Approval missing or plan expired
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
